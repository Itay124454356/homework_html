<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>דף הרשמה</title>
</head>
<body>

    <table border="1" style="width:80%" align="center" cellpadding="10">
        <tr>
            <td colspan="8"></td>
        </tr>
        <tr align="center">
            <td style="width:20%"></td>
            <td style="width:20%"><b>LOGO</b></td>
            <td style="width:5%"><b>צור<br />קשר</b></td>
            <td style="width:8%"><b>תכנון</b></td>
            <td style="width:8%"><b>אודות</b></td>
            <td style="width:8%"><b>על<br />הפרויקט</b></td>
            <td style="width:3%"></td>
            <td style="width:20%"></td>
        </tr>
        <tr>
            <td align="center" colspan="8" style="background-color:#eaf4ff;" height="70">
                <h1 style="color:green;">דף הרשמה</h1>
            </td>
        </tr>
    </table>
    <br />
    <br />

    <form action="https://handasaim.co.il/">
        <table border="1" style="width:80%" align="center" dir="rtl" cellpadding="5">
            <tr>

                <td valign="top" style="width:50%">
                    <table border="1" style="width:100%" cellpadding="10">
                        <tr>
                            <td><b>שם פרטי:</b></td>
                            <td>
                                <input type="text"
                                       id="firstName"
                                       name="firstName"
                                       maxlength="50"
                                       placeholder="שם פרטי" />
                            </td>
                        </tr>
                        <tr>
                            <td><b>שם משפחה:</b></td>
                            <td>
                                <input type="text"
                                       id="lastName"
                                       name="lastName"
                                       maxlength="50"
                                       placeholder="שם משפחה" />
                            </td>
                        </tr>
                        <tr>
                            <td><b>Email:</b></td>
                            <td>
                                <input type="email"
                                       id="userEmail"
                                       name="userEmail"
                                       maxlength="50"
                                       placeholder="Email" />
                            </td>
                        </tr>
                        <tr>
                            <td><b>סיסמא:</b></td>
                            <td>
                                <input type="password"
                                       id="userpassword"
                                       name="userpassword"
                                       maxlength="50"
                                       placeholder="סיסמא" />
                                <br />
                                <input type="checkbox" id="showPassword" name="showPassword">
                                <label for="showPassword">Show Password</label>
                            </td>
                        </tr>
                        <tr>
                            <td><b>אימות סיסמא:</b></td>
                            <td>
                                <input type="password"
                                       id="userpassword2"
                                       name="userpassword2"
                                       maxlength="50"
                                       placeholder="אימות סיסמא" />
                            </td>
                        </tr>
                    </table>
                </td>

                <td valign="top" style="width:50%">
                    <table border="1" style="width:100%" cellpadding="10">
                        <tr>
                            <td><b>טלפון:</b></td>
                            <td>
                                <input type="text"
                                       id="userPhone"
                                       name="userPhone"
                                       maxlength="7"
                                       placeholder="טלפון נייד" />
                                <select id="pref" name="pref">
                                    <option value="050">050</option>
                                    <option value="052" selected>052</option>
                                    <option value="053">053</option>
                                    <option value="054">054</option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td><b>תאריך לידה:</b></td>
                            <td>
                                <select id="birthDay" name="birthDay">
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                    <option value="6">6</option>
                                    <option value="7">7</option>
                                    <option value="8">8</option>
                                    <option value="9">9</option>
                                    <option value="10">10</option>
                                    <option value="11">11</option>
                                    <option value="12">12</option>
                                    <option value="13">13</option>
                                    <option value="14">14</option>
                                    <option value="15">15</option>
                                    <option value="16" selected>16</option>
                                    <option value="17">17</option>
                                    <option value="18">18</option>
                                    <option value="19">19</option>
                                    <option value="20">20</option>
                                    <option value="21">21</option>
                                    <option value="22">22</option>
                                    <option value="23">23</option>
                                    <option value="24">24</option>
                                    <option value="25">25</option>
                                    <option value="26">26</option>
                                    <option value="27">27</option>
                                    <option value="28">28</option>
                                    <option value="29">29</option>
                                    <option value="30">30</option>
                                    <option value="31">31</option>
                                </select>
                                <select id="birthMonth" name="birthMonth">
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                    <option value="6">6</option>
                                    <option value="7">7</option>
                                    <option value="8">8</option>
                                    <option value="9">9</option>
                                    <option value="10" selected>10</option>
                                    <option value="11">11</option>
                                    <option value="12">12</option>
                                </select>
                                <select id="birthYear" name="birthYear">
                                    <option value="2026">2026</option>
                                    <option value="2025" selected>2025</option>
                                    <option value="2024">2024</option>
                                    <option value="2023">2023</option>
                                    <option value="2022">2022</option>
                                    <option value="2021">2021</option>
                                    <option value="2020">2020</option>
                                    <option value="2019">2019</option>
                                    <option value="2018">2018</option>
                                    <option value="2017">2017</option>
                                    <option value="2016">2016</option>
                                    <option value="2015">2015</option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td><b>מגדר:</b></td>
                            <td>
                                <input type="radio" id="male" name="gender" value="male">
                                <label for="male">זכר</label>
                                <input type="radio" id="female" name="gender" value="female">
                                <label for="female">נקבה</label>
                            </td>
                        </tr>
                        <tr>
                            <td colspan="2">
                                <input type="checkbox" id="terms" name="terms">
                                <label for="terms">נא לעיין בתקנון ולאשר את <a href="#">תנאי שימוש</a> באתר</label>
                            </td>
                        </tr>
                        <tr>
                            <td colspan="2" style="text-align:center;">
                                <input type="submit" value="Submit" style="width:100%; height:40px; background-color:#5aac44; color:white; font-size:16px;" />
                            </td>
                        </tr>
                    </table>
                </td>

            </tr>
        </table>
    </form>

</body>

</html>
