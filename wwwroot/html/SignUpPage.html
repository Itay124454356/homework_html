<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
</head>
<body>
    <table border="1" style="width:100%" cellpadding="15">

        <tr>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
        </tr>
        <tr>
            <td style="width:20%"></td>
            <td colspan="4"><h1>HTML SignUp Form</h1></td>
            <td style="width:20%"></td>
        </tr>
    </table>
    <br/>
    <table border="1" style="width:100%" >
        <tr>
            <td style="width:20%"></td>
            <td>
                <form>
                    <table align="center" border="1" dir="rtl" cellpadding="10">
                        <tr>
                            <td>שם פרטי:</td>
                            <td>
                                <input type="text"
                                       id="firstName"
                                       name="firstName"
                                       maxlength="50" 
                                       placeholder="שם פרטי"/>
                        </tr>
                        <tr>
                            <td>שם משפחה:</td>
                            <td>
                                <input type="text"
                                       id="lastName"
                                       name="lastName"
                                       maxlength="50" 
                                       placeholder="שם משפחה"/>
                            </td>
                        </tr>
                        <tr>
                            <td>email:</td>
                            <td>
                                <input type="email"
                                       id="userEmail"
                                       name="userEmail"
                                       maxlength="50" 
                                       placeholder="email"/>
                            </td>
                        </tr>
                        <tr>
                            <td>טלפון:</td>
                            <td>
                                <input type="number"
                                       id="userPhone"
                                       name="userPhone"
                                       maxlength="7"
                                       placeholder="phone" />
                                <select id="pref" name="pref">
                                    <option value="050">050</option>
                                    <option value="052">052</option>
                                    <option value="053">053</option>
                                    <option value="054">054</option>

                                </select>
                            </td>
                        </tr>
                    </table>
                </form>
            </td>
            <td style="width:20%"></td>
        </tr>

    </table>

</body>
</html>
