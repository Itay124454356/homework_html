<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
</head>
<body>
    <table border="1" style="width:100%" cellpadding="15">

        <tr>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
        </tr>
        <tr>
            <td style="width:20%"></td>
            <td colspan="4"><h1>HTML SignUp Form</h1></td>
            <td style="width:20%"></td>
        </tr>
    </table>
    <br/>
    <table border="1" style="width:100%" >
        <tr>
            <td style="width:20%"></td>
            <td>
                <form action="https://handasaim.co.il/">
                    <table align="center" border="1" dir="rtl" cellpadding="10">
                        <tr>
                            <td>שם פרטי:</td>
                            <td>
                                <input type="text"
                                       id="firstName"
                                       name="firstName"
                                       maxlength="50"
                                       placeholder="שם פרטי" />
                        </tr>
                        <tr>
                            <td>שם משפחה:</td>
                            <td>
                                <input type="text"
                                       id="lastName"
                                       name="lastName"
                                       maxlength="50"
                                       placeholder="שם משפחה" />
                            </td>
                        </tr>
                        <tr>
                            <td>email:</td>
                            <td>
                                <input type="email"
                                       id="userEmail"
                                       name="userEmail"
                                       maxlength="50"
                                       placeholder="email" />
                            </td>
                        </tr>
                        <tr>
                            <td>טלפון:</td>
                            <td>
                                <input type="number"
                                       id="userPhone"
                                       name="userPhone"
                                       maxlength="7"
                                       placeholder="phone" />
                                <select id="pref" name="pref">
                                    <option value="050">050</option>
                                    <option value="052">052</option>
                                    <option value="053">053</option>
                                    <option value="054">054</option>

                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td>סיסמא:</td>
                            <td>
                                <input type="password"
                                       id="userpassword"
                                       name="userpassword"
                                       maxlength="50"
                                       placeholder="password" />
                            </td>
                        </tr>
                        <tr>
                            <td>תאריך לידה:</td>
                            <td>
                                <!-- Day / Month / Year selects for birth date -->
                                <select id="birthDay" name="birthDay">
                                    <option value="">Day</option>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                    <option value="6">6</option>
                                    <option value="7">7</option>
                                    <option value="8">8</option>
                                    <option value="9">9</option>
                                    <option value="10">10</option>
                                    <option value="11">11</option>
                                    <option value="12">12</option>
                                    <option value="13">13</option>
                                    <option value="14">14</option>
                                    <option value="15">15</option>
                                    <option value="16">16</option>
                                    <option value="17">17</option>
                                    <option value="18">18</option>
                                    <option value="19">19</option>
                                    <option value="20">20</option>
                                    <option value="21">21</option>
                                    <option value="22">22</option>
                                    <option value="23">23</option>
                                    <option value="24">24</option>
                                    <option value="25">25</option>
                                    <option value="26">26</option>
                                    <option value="27">27</option>
                                    <option value="28">28</option>
                                    <option value="29">29</option>
                                    <option value="30">30</option>
                                    <option value="31">31</option>
                                </select>
                                <select id="birthMonth" name="birthMonth">
                                    <option value="">Month</option>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                    <option value="6">6</option>
                                    <option value="7">7</option>
                                    <option value="8">8</option>
                                    <option value="9">9</option>
                                    <option value="10">10</option>
                                    <option value="11">11</option>
                                    <option value="12">12</option>
                                </select>
                                <select id="birthYear" name="birthYear">
                                    <option value="">Year</option>
                                    <option value="2026">2026</option>
                                    <option value="2025">2025</option>
                                    <option value="2024">2024</option>
                                    <option value="2023">2023</option>
                                    <option value="2022">2022</option>
                                    <option value="2021">2021</option>
                                    <option value="2020">2020</option>
                                    <option value="2019">2019</option>
                                    <option value="2018">2018</option>
                                    <option value="2017">2017</option>
                                    <option value="2016">2016</option>
                                    <option value="2015">2015</option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td>מין:</td>
                            <td>
                                <input type="radio" id="male" name="gender" value="male">
                                <label for="male">זכר</label>
                                <input type="radio" id="female" name="gender" value="female">
                                <label for="female">נקבה</label>
                            </td>
                        </tr>
                        <tr>
                            <td>תחום עניין:</td>
                            <td>
                                <input type="checkbox" id="sports" name="interests" value="sports">
                                <label for="sports">ספורט</label>
                                <input type="checkbox" id="music" name="interests" value="music">
                                <label for="music">מוזיקה</label>
                                <input type="checkbox" id="travel" name="interests" value="movies">
                                <label for="travel">סרטים</label>
                            </td>
                        </tr>
                        <tr>
                            
                            <td colspan="2" style="text-align:center;">
                            <input type="submit" value="שלח" />
                            <input type="reset" value="איפוס" />
                            </td>
                        </tr>
                    </table>
                </form>
            </td>
            <td style="width:20%"></td>
        </tr>

    </table>

</body>
</html>
